[env:esp32c3_supermini]
platform  = espressif32
board     = lolin_c3_mini
framework = arduino

build_flags =
    -std=gnu++17
    -D MESH_DEBUG=1

upload_protocol = esptool
upload_speed    = 921600
monitor_speed   = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    fastled/FastLED @ ^3.7.0

[env:led_test]
extends         = env:esp32c3_supermini
build_src_filter = -<*> +<../examples/led_test/*>
lib_deps         = fastled/FastLED @ ^3.7.0


[env:led_node]
extends         = env:esp32c3_supermini
build_src_filter = +<*> +<../examples/led_node/*>
lib_deps         = 
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.0.0
